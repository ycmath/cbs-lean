name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1

  documentation:
    # docgen builds API docs only for push events. PR/manual runs check Lean above.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Build API documentation without publishing a website
        uses: leanprover-community/docgen-action@56023ee2a4b3630c1071825be5bafdb43f540bbd
        with:
          deploy: 'false'
          build-page: 'false'
      - name: Retain generated documentation
        uses: actions/upload-artifact@v4
        with:
          name: api-documentation
          path: docs
          if-no-files-found: error
          retention-days: 14
